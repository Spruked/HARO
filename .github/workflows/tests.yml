name: HARO tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run HARO suites
        shell: bash
        run: python -m unittest discover -s tests -q
      - name: Run A.I.M.S. suite
        shell: bash
        run: cd AIMS && python -m unittest discover -s tests -q
